<script>
  // ?view=player: the meanings stay with the GM; the card, its suns and what it does to
  // magic are the table's and show. The page follows the shared state like any window.
  (function () {
    const player = new URLSearchParams(location.search).get('view') === 'player';
    if (player) document.body.classList.add('player');
    document.getElementById('board-sub').textContent = player ? 'the Sooth Deck, as it lies' : 'the Sooth Deck, as it lies · the GM’s board';
    window.IsSooth.renderBoard(document.getElementById('board-main'), { player });
  })();
</script>
